<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><title>Example 1: forward through one neuron, then backward to its weights</title>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#237598"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b43b42"/></marker></defs>
<rect width="1100" height="430" rx="12" fill="#ffffff"/>
<text x="550" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#233b4a">EXAMPLE 1 • ONE OUTPUT NEURON</text>
<circle cx="85" cy="130" r="49" fill="#e9f4f9" stroke="#94b4c5" stroke-width="1.5"/>
<text x="85" y="124.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#233b4a">x₁</text>
<text x="85" y="152.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#233b4a">0.5</text>
<circle cx="85" cy="280" r="49" fill="#e9f4f9" stroke="#94b4c5" stroke-width="1.5"/>
<text x="85" y="274.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#233b4a">x₂</text>
<text x="85" y="302.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#233b4a">−1</text>
<path d="M135,130 L350,180" fill="none" stroke="#237598" stroke-width="2.5"  marker-end="url(#blue)"/>
<path d="M135,280 L350,220" fill="none" stroke="#237598" stroke-width="2.5"  marker-end="url(#blue)"/>
<text x="240" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#233b4a">w₁ = 0.8</text>
<text x="245" y="295" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#233b4a">w₂ = −0.4</text>
<rect x="355" y="150" width="190" height="110" rx="14" fill="#e9f4f9" stroke="#94b4c5" stroke-width="1.5"/>
<text x="450.0" y="181.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#233b4a">Weighted sum</text>
<text x="450.0" y="213.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#233b4a">z = 0.9</text>
<text x="450.0" y="245.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#233b4a">b = 0.1</text>
<path d="M545,205 L615,205" fill="none" stroke="#237598" stroke-width="2.5"  marker-end="url(#blue)"/>
<rect x="625" y="160" width="180" height="90" rx="14" fill="#e9f4f9" stroke="#94b4c5" stroke-width="1.5"/>
<text x="715.0" y="197.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#233b4a">Sigmoid</text>
<text x="715.0" y="229.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#233b4a">p = 0.710950</text>
<path d="M805,205 L865,205" fill="none" stroke="#237598" stroke-width="2.5"  marker-end="url(#blue)"/>
<rect x="875" y="160" width="205" height="90" rx="14" fill="#fff0dd" stroke="#94b4c5" stroke-width="1.5"/>
<text x="977.5" y="197.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#233b4a">Loss, y = 1</text>
<text x="977.5" y="229.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#233b4a">ℓ = 0.341154</text>
<path d="M965,295 L455,295" fill="none" stroke="#b43b42" stroke-width="2.5"  marker-end="url(#red)"/>
<text x="715" y="335" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#b43b42">Backward: ∂ℓ/∂z = p − y = −0.289050</text>
<text x="550" y="390" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#b43b42">Weight gradients: (p − y)x₁ = −0.144525;  (p − y)x₂ = 0.289050</text>
</svg>