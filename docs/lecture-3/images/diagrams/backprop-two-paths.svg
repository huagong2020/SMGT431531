<text x="550" y="451" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#b43b42">Add first: ∂ℓ/∂h = −0.696582 → ∂ℓ/∂w = (−0.696582) × 1 × 1</text>
