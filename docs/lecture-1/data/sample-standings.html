<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sample Football Results</title>
</head>
<body>
  <main>
    <h1>Sample Football Results</h1>
    <p class="updated">Updated: January 8, 2024</p>

    <section id="featured-games">
      <article class="game-card" data-game-id="G01">
        <h2>Buffalo 21, Miami 14</h2>
        <span class="status">Final</span>
        <a class="box-score" href="/games/G01">Box score</a>
      </article>
      <article class="game-card" data-game-id="G02">
        <h2>Dallas 20, Philadelphia 27</h2>
        <span class="status">Final</span>
        <a class="box-score" href="/games/G02">Box score</a>
      </article>
    </section>

    <table class="advertisement">
      <thead><tr><th>Partner</th><th>Message</th></tr></thead>
      <tbody><tr><td>Example Sponsor</td><td>Advertisement</td></tr></tbody>
    </table>

    <table id="standings">
      <caption>Four-team teaching standings</caption>
      <thead>
        <tr><th>Team</th><th>W</th><th>L</th><th>Point differential</th></tr>
      </thead>
      <tbody>
        <tr><td>Baltimore</td><td>13</td><td>4</td><td>+203</td></tr>
        <tr><td>Buffalo</td><td>11</td><td>6</td><td>+140</td></tr>
        <tr><td>Dallas</td><td>12</td><td>5</td><td>+194</td></tr>
        <tr><td>Philadelphia</td><td>11</td><td>6</td><td>+5</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
